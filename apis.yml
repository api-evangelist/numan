name: Numan
description: 'Numan (trading as Vir Health Limited) is a UK-based digital healthcare and telemedicine
  company offering convenient, clinician-led care direct to consumers. Its services span weight-loss
  programmes (including GLP-1 medications such as Mounjaro and Wegovy), men''s health (erectile
  dysfunction, hair loss, testosterone), women''s health (menopause support), at-home blood tests
  and diagnostics, supplements, and one-off doctor consultations, delivered through its website and
  iOS/Android app. Numan is regulated by the Care Quality Commission and operates a GPhC-licensed
  pharmacy. It is a portfolio company of Anthemis. As of this enrichment pass Numan publishes no
  public developer API, SDKs, MCP server, or partner integration surface.'
